# Mostly-On controller.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d
#   open http://localhost:8080
#
# Update to a newer version:
#   docker compose pull && docker compose up -d
#
# Want to try it with some demo SQL Servers included? See docker-compose.demo.yml.
name: mostly-on

services:
  controller:
    # :latest is the newest release. Pin a version (for example :0.2) to
    # choose when you upgrade, or use :edge for every change on main.
    image: ghcr.io/strdco/mostly-on:latest
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env (see README)}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (openssl rand -base64 32)}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_API_URL: ${PUSHOVER_API_URL:-https://api.pushover.net/1/messages.json}
    ports: ["${CONTROLLER_PORT:-8080}:8080"]
    volumes:
      # The catalog (settings, history, operation journal). Keep this volume:
      # without it, everything is lost when the container is replaced.
      - controller-data:/data
      # The shared backup folder that your SQL Servers write to. Replace this
      # with the share, mounted on this machine (/mnt/sqlbackup:/backup).
      # See setup/mostly-on-container.md.
      - backup:/backup

volumes:
  controller-data:
  backup:
