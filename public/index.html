<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Mostly On - simple log shipping without SQL Server Agent</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="app.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <span class="visually-hidden skip-link"><button type="button" id="skip-to-content">Skip to content</button></span>
    <header class="topbar" id="topbar" hidden>
        <div class="topbar-inner">
            <a class="brand" href="#/">Mostly On</a>
            <nav class="site-nav" aria-label="Main">
                <!-- Narrow: the list is a popover opened by this button. Wide: app.js removes
                     the popover attribute and the list sits inline. -->
                <button class="menu-button" type="button" popovertarget="site-menu" aria-controls="site-menu">Menu</button>
                <ul id="site-menu" class="site-menu" popover="auto">
                    <li><a href="#/">Overview</a></li>
                    <li><a href="#/servers">Servers</a></li>
                    <li><a href="#/alerts">Alerts</a></li>
                    <li><a href="#/operations">Operations</a></li>
                    <li><a href="#/events">Events</a></li>
                    <li><a href="#/settings">Settings</a></li>
                </ul>
            </nav>
            <span class="live" id="live-indicator">offline</span>
            <button type="button" class="link" id="logout">Sign out</button>
        </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
