# Test overrides: the controller built from this source tree instead of the
# published image, and a mock Pushover API that records every message.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml -f docker-compose.test.yml up -d --build
#   curl http://localhost:9911/messages
name: mostly-on

services:
  mock-pushover:
    image: node:26-trixie-slim
    command: ["node", "/mock/mock-pushover.mjs"]
    volumes:
      - ./test/mock-pushover.mjs:/mock/mock-pushover.mjs:ro
    ports: ["${MOCK_PUSHOVER_PORT:-9911}:9911"]
    restart: unless-stopped

  controller:
    build: .
    image: mostly-on:dev
    environment:
      PUSHOVER_APP_TOKEN: test-app-token
      PUSHOVER_USER_KEY: test-user-key
      PUSHOVER_API_URL: http://mock-pushover:9911/1/messages.json
      # Automatic management waits seconds instead of minutes (engine/auto-manage.js).
      MOSTLY_ON_TEST_AUTO_SECONDS: "15"
    depends_on:
      mock-pushover:
        condition: service_started
